<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>You're offline · Commerce</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #18181b;
    }
    main { max-width: 22rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: #71717a; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #09090b; color: #fafafa; }
      p { color: #a1a1aa; }
    }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page needs a connection. Check yours and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>

</html>
